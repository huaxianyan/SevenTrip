name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate tag and app version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            release_tag="$GITHUB_REF_NAME"
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)
            release_tag="v${version}"
          fi
          test -n "$version"
          grep -Fq "versionName = \"${version}\"" app/build.gradle.kts
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"

      - name: Restore release signing bundle
        shell: bash
        env:
          RELEASE_BUNDLE: ${{ secrets.ANDROID_RELEASE_BUNDLE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_BUNDLE"
          signing_dir="$HOME/.android/signing/WalletAssistant"
          mkdir -p "$signing_dir"
          printf '%s' "$RELEASE_BUNDLE" | base64 --decode | tar -xz -C "$signing_dir"
          test -f "$signing_dir/signing.properties"
          test -f "$signing_dir/wallet.properties"
          store_file=$(awk -F= '$1 == "storeFile" { print $2 }' "$signing_dir/signing.properties" | tr -d '\r')
          test -n "$store_file"
          test -f "$signing_dir/$store_file"
          chmod 600 "$signing_dir"/*

      - name: Test and build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:assembleRelease

      - name: Verify signature and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          asset="chuxing-${VERSION}.apk"
          expected_certificate="eafaba2f329a58d091d1641630339f2cc3e81bb72c4e3e048fe5f068fe2be2be"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          signature_info=$($apksigner verify --print-certs "$apk")
          echo "$signature_info"
          actual_certificate=$(echo "$signature_info" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr -d '\r' | tr '[:upper:]' '[:lower:]')
          [[ "$actual_certificate" == "$expected_certificate" ]]
          mkdir -p release
          cp "$apk" "release/$asset"
          (cd release && sha256sum "$asset" > "$asset.sha256")

      - name: Verify release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_release_notes.py "docs/release-notes-${RELEASE_TAG}.md"

      - name: Prepare Release notes
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/release-notes-${RELEASE_TAG}.md"
          test -f "$notes_file"
          asset="chuxing-${VERSION}.apk"
          {
            cat "$notes_file"
            printf '\n## 构建信息\n\n'
            printf '| 项目 | 值 |\n'
            printf '| --- | --- |\n'
            printf '| 版本 | `%s` |\n' "$RELEASE_TAG"
            printf '| %s SHA-256 | `%s` |\n' "$asset" "$(sha256sum "release/$asset" | cut -d' ' -f1)"
          } > release-notes.md

      - name: Upload dry-run artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: chuxing-${{ env.VERSION }}-dry-run
          path: release/*
          retention-days: 1

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "release/chuxing-${VERSION}.apk#Android APK" \
            "release/chuxing-${VERSION}.apk.sha256#SHA-256" \
            --verify-tag \
            --latest \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md
